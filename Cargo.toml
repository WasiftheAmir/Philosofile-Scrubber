[package]
name = "philosofile-scrubber"
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
description = "Standalone privacy scrubber exported from Philosofile"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "philosofile_scrubber"
path = "src-tauri/src/pipeline/scrubber.rs"

[dependencies]
dirs = "6"
fast_image_resize = { version = "5", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lindera = { version = "6.2.0" }
rayon = "1.10"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
apple-vision = { version = "0.16.7", features = ["recognize_text", "detect_faces"] }
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_Com",
    "Media_FaceAnalysis",
] }

[dev-dependencies]
md5 = "0.8.1"
sha2 = "0.10"
